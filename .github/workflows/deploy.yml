name: Deploy public_html to hosting (FTP/FTPS)

on:
  push:
    branches: [ "main" ]        # Tự động deploy khi push code lên nhánh main
  workflow_dispatch: {}          # Cho phép chạy thủ công từ tab Actions

concurrency:
  group: deploy
  cancel-in-progress: true       # Hủy run cũ nếu có run mới cùng nhóm

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # Giới hạn 30 phút để tránh treo quá lâu
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy via FTP/FTPS (incremental)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       ${{ secrets.FTP_PORT }}          # Shared hosting DirectAdmin: 21
          protocol:   ftps                             # Nếu lỗi TLS thì đổi thành: ftp
          server-dir: /domains/vidieu.vn/public_html/  # Đường dẫn gốc trên hosting
          local-dir:  ./                               # Repo root chính là public_html
          state-name: .ftp-deploy-sync-state.json      # File state để sync incremental
          log-level: verbose

          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.log
            .DS_Store

            # Thư mục nặng/biến đổi liên tục
            wp-content/uploads/**
            wp-content/cache/**
            wp-content/upgrade/**
            wp-content/wflogs/**

            # Khu vực nhạy cảm / ít khi thay đổi
            wp-admin/**
            wp-includes/**
            wp-config.php
            .htaccess

            # Bỏ qua workflow rác trong vendor/plugins bên thứ ba
            wp-content/plugins/**/.github/**
