name: Deploy wp-admin only

on:
  push:
    paths:
      - 'wp-admin/**'               # chỉ khi có thay đổi trong wp-admin mới chạy
  workflow_dispatch: {}              # cho phép chạy thủ công

concurrency:
  group: deploy-wp-admin
  cancel-in-progress: true

jobs:
  deploy-wp-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy wp-admin via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /domains/vidieu.vn/public_html/wp-admin/    # thư mục wp-admin trên hosting
          local-dir: ./wp-admin/                                  # thư mục wp-admin local trong repo
          state-name: .ftp-deploy-wp-admin-sync.json
          log-level: verbose

          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.log
            .DS_Store
