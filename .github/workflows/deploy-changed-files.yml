name: Deploy child theme (FTP/FTPS)

on:
  push:
    branches: [ "main" ]   # Tự động deploy khi push lên nhánh main
  workflow_dispatch: {}    # Có thể chạy thủ công từ tab Actions

concurrency:
  group: deploy-child-theme
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_ROOT: /domains/vidieu.vn/public_html
      FTP_SERVER:   ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT:     ${{ secrets.FTP_PORT }}

    steps:
      # 1) Checkout đủ history để diff chính xác
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Lấy danh sách file thay đổi trong child theme
      - name: Get changed files (child theme only)
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            wp-content/themes/elessi-theme-child/**
          separator: "\n"
          fetch_depth: 0
          diff_relative: false
          use_posix_path_separator: true
          json: false

      # 3) Debug: in ra SHA và danh sách file
      - name: Show commit range and changed files
        run: |
          echo "BASE SHA: ${{ steps.changes.outputs.base_sha }}"
          echo "HEAD SHA: ${{ steps.changes.outputs.sha }}"
          echo
          echo "Added/Modified:"
          printf '%s\n' "${{ steps.changes.outputs.added_modified_files }}"
          echo
          echo "Deleted:"
          printf '%s\n' "${{ steps.changes.outputs.deleted_files }}"
          echo
          echo "Last 2 commits:"
          git log -2 --oneline

      # 4) Upload các file đã thêm/sửa
      - name: Upload added/modified via (F)TPS
        if: ${{ steps.changes.outputs.added_modified_files != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.changes.outputs.added_modified_files }}" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Upload $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv --ftp-create-dirs --ssl-reqd \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 -T "$FILE" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}${REMOTE_ROOT}/${FILE}"
          done

      # 5) Xóa file đã bị xóa trong repo
      - name: Delete removed files on server
        if: ${{ steps.changes.outputs.deleted_files != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.changes.outputs.deleted_files }}" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Delete $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv --ssl-reqd \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}/" \
                 -Q "DELE ${REMOTE_ROOT}/${FILE}" || true
          done
