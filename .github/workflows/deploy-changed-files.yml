name: Deploy changed files only (FTP/FTPS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}           # cho phép chạy tay

concurrency:
  group: deploy-changed-only
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **                                      # theo dõi toàn repo
          separator: "\n"
          fetch_depth: 0                            # lấy full history để diff chắc hơn
          since_last_remote_commit: true            # diff so với commit trước đó trên remote
          diff_relative: false
          use_posix_path_separator: true
          json: false

      - name: Show summary
        run: |
          echo "BASE..HEAD:"
          echo "${{ steps.changes.outputs.base_sha }} .. ${{ steps.changes.outputs.sha }}"
          echo
          echo "Added/Modified:"
          echo "${{ steps.changes.outputs.added_modified_files }}"
          echo
          echo "Deleted:"
          echo "${{ steps.changes.outputs.deleted_files }}"

      # Upload CHỈ các file thêm/sửa
      - name: Upload added/modified files via (F)TPS
        if: ${{ steps.changes.outputs.added_modified_files != '' }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT:     ${{ secrets.FTP_PORT }}    # thường 21
          REMOTE_ROOT:  /domains/vidieu.vn/public_html
        run: |
          set -euo pipefail
          echo "${{ steps.changes.outputs.added_modified_files }}" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Upload $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv --ftp-create-dirs \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 -T "$FILE" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}${REMOTE_ROOT}/${FILE}"
          done

      # XÓA trên host những file đã bị xoá trong repo (nếu có)
      - name: Delete removed files on server
        if: ${{ steps.changes.outputs.deleted_files != '' }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT:     ${{ secrets.FTP_PORT }}
          REMOTE_ROOT:  /domains/vidieu.vn/public_html
        run: |
          set -euo pipefail
          echo "${{ steps.changes.outputs.deleted_files }}" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Delete $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}/" \
                 -Q "DELE ${REMOTE_ROOT}/${FILE}" || true
          done
