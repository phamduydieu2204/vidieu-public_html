name: Deploy child theme (FTP/FTPS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-child-theme
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_ROOT: /domains/vidieu.vn/public_html
      FTP_SERVER:   ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT:     ${{ secrets.FTP_PORT }}

    steps:
      # 1) Checkout repo với đủ history để diff chính xác
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Lấy danh sách file thay đổi trong child theme
      - name: Get changed files (child theme only)
        id: diff
        run: |
          # So sánh với nhánh origin/main trước khi push
          git fetch origin main --depth=50

          echo "🔎 Changed files in wp-content/themes/elessi-theme-child/:"
          git diff --name-only origin/main HEAD -- wp-content/themes/elessi-theme-child/ > changed.txt || true
          cat changed.txt

          # Xuất output cho bước sau
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat changed.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3) Debug: in ra commit và danh sách file
      - name: Debug info
        run: |
          echo "BASE: origin/main"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Last 3 commits:"
          git log -3 --oneline
          echo "Changed files from diff:"
          cat changed.txt || true

      # 4) Upload file thay đổi qua FTP/FTPS
      - name: Upload changed files
        if: ${{ steps.diff.outputs.files != '' }}
        run: |
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Upload $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv --ftp-create-dirs --ssl-reqd \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 -T "$FILE" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}${REMOTE_ROOT}/${FILE}"
          done < changed.txt
