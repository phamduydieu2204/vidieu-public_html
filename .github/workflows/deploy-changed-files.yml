name: Deploy changed files only (FTP/FTPS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-changed-only
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_ROOT: /domains/vidieu.vn/public_html
      FTP_SERVER:   ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT:     ${{ secrets.FTP_PORT }}

    steps:
      # 1) Lấy full history để diff chắc chắn
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Bắt diff đúng 2 SHA của sự kiện push
      - name: Get changed files (child theme only)
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          base_sha: ${{ github.event.before }}
          sha:      ${{ github.sha }}
          files: |
            wp-content/themes/elessi-theme-child/**
          separator: "\n"
          diff_relative: false
          use_posix_path_separator: true
          fetch_depth: 0
          json: false

      # 3) In SHA & danh sách file để tự đối chiếu
      - name: Show summary + fallback diff
        run: |
          echo "BASE: ${{ steps.changes.outputs.base_sha }}"
          echo "HEAD: ${{ steps.changes.outputs.sha }}"
          echo
          echo "Added/Modified (from action):"
          printf '%s\n' "${{ steps.changes.outputs.added_modified_files }}"
          echo
          echo "Deleted (from action):"
          printf '%s\n' "${{ steps.changes.outputs.deleted_files }}"
          echo
          echo "Fallback git diff (for debug):"
          git diff --name-status "${{ steps.changes.outputs.base_sha }}" "${{ steps.changes.outputs.sha }}" -- wp-content/themes/elessi-theme-child/

      # 4) Upload CHỈ file đã thêm/sửa
      - name: Upload added/modified via (F)TPS
        if: ${{ steps.changes.outputs.added_modified_files != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.changes.outputs.added_modified_files }}" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Upload $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv --ftp-create-dirs --ssl-reqd \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 -T "$FILE" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}${REMOTE_ROOT}/${FILE}"
          done

      # 5) XÓA trên host các file đã bị xóa trong repo
      - name: Delete removed on server
        if: ${{ steps.changes.outputs.deleted_files != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.changes.outputs.deleted_files }}" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ Delete $FILE"
            curl --fail --show-error --silent \
                 --ftp-method nocwd --ftp-pasv --ssl-reqd \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 "ftp://${FTP_SERVER}:${FTP_PORT}/" \
                 -Q "DELE ${REMOTE_ROOT}/${FILE}" || true
          done
