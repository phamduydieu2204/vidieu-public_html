name: Deploy child theme (FTP/FTPS)

on:
  push:
    branches: [ "main" ]
    paths:
      - "wp-content/themes/elessi-theme-child/**"   # chỉ chạy khi child theme đổi
  workflow_dispatch: {}                              # có thể bấm chạy tay

concurrency:
  group: deploy-child-theme
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy child theme via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       ${{ secrets.FTP_PORT }}  # shared hosting thường là 21
          protocol:   ftps                     # nếu host không hỗ trợ FTPS thì đổi thành: ftp

          # Chỉ sync thư mục child theme
          local-dir:  ./wp-content/themes/elessi-theme-child/
          server-dir: /domains/vidieu.vn/public_html/wp-content/themes/elessi-theme-child/

          # File state riêng cho child theme (giữ incremental cho lần sau)
          state-name: .ftp-deploy-child-theme-state.json

          # Log gọn; đổi "verbose" nếu cần debug
          log-level: minimal

          # Chỉ loại bỏ những thứ chắc chắn không cần
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.log
            **/*.map
            .DS_Store
